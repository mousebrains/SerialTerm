name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # In the macOS 27 SDK these are macros whose compiler plugin ships only with Xcode, so they
      # break builds with the Command Line Tools. The runners' older SDKs wouldn't catch State.
      - name: No Xcode-only SwiftUI macros
        run: |
          if grep -rnwE '@(State|Entry|Animatable|AnimatableIgnored)' Sources; then
            echo "::error::These need Xcode's SwiftUIMacros plugin; use an ObservableObject held by @StateObject."
            exit 1
          fi

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(printf "%s\n" /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          echo "name=$(basename "$XCODE" .app)" >> "$GITHUB_OUTPUT"

      - name: Install lrzsz (interop tests, XMODEM/YMODEM)
        run: brew install lrzsz

      # Keyed by Xcode too: a .build from another toolchain can fail to link or import.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.name }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.name }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Performance tests (release)
        run: swift test -c release --filter ZmodemPerformanceTests

  app:
    name: App bundle
    runs-on: macos-15
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(printf "%s\n" /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Build SerialTerm.app
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
        run: ./scripts/make-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/SerialTerm.app build/SerialTerm.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SerialTerm-${{ github.sha }}
          path: build/SerialTerm.zip
          retention-days: 14

  # Swift 5 language mode doesn't check for data races; Thread Sanitizer finds them at run time
  # in the suites with the most threads (serial I/O, sessions, pacing, transfers).
  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select newest Xcode
        run: |
          XCODE=$(printf "%s\n" /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Install lrzsz
        run: brew install lrzsz

      - name: Test with Thread Sanitizer
        run: |
          swift test --sanitize=thread --filter \
            'PacingTests|PacingCancelTests|PacedSessionTests|SerialPortPtyTests|SerialPortRobustnessTests|SessionLifecycleTests|LogFileTests|ExternalTransferBehaviourTests|ZmodemSessionLeftoverTests|ZmodemReceiverRobustnessTests' \
            2>&1 | tee tsan.log
          if grep -q "WARNING: ThreadSanitizer" tsan.log; then
            echo "::error::Thread Sanitizer reported a data race"
            exit 1
          fi

  command-line-tools:
    name: App bundle (Command Line Tools only)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show Command Line Tools
        run: |
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables
          swift --version

      - name: Build SerialTerm.app
        run: ./scripts/make-app.sh
