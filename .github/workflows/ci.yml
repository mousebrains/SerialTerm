name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # In the macOS 27 SDK these are macros whose compiler plugin ships only with Xcode, so they
      # break builds with the Command Line Tools. The runners' older SDKs wouldn't catch State.
      - name: No Xcode-only SwiftUI macros
        run: |
          if grep -rnwE '@(State|Entry|Animatable|AnimatableIgnored)' Sources; then
            echo "::error::These need Xcode's SwiftUIMacros plugin; use an ObservableObject held by @StateObject."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Install lrzsz (interop tests, XMODEM/YMODEM)
        run: brew install lrzsz

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Performance tests (release)
        run: swift test -c release --filter ZmodemPerformanceTests

  app:
    name: App bundle
    runs-on: macos-15
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Build SerialTerm.app
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
        run: ./scripts/make-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/SerialTerm.app build/SerialTerm.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SerialTerm-${{ github.sha }}
          path: build/SerialTerm.zip
          retention-days: 14

  command-line-tools:
    name: App bundle (Command Line Tools only)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v7

      - name: Show Command Line Tools
        run: |
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables
          swift --version

      - name: Build SerialTerm.app
        run: ./scripts/make-app.sh
